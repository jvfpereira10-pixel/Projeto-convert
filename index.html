<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto conversão de moedas</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        
        <h1>CONVERT</h1>
        <div class="values" id="converts">
            <form>
                <div class="l-div">
                    <label for="value-money">VALOR</label>
                    <input type="text" class="convert" id="value-money" min="0" placeholder="0" required>
                </div>
                
                <div class="l-div">
                    <label for="select-lan">MOEDA</label>
                    <select class="convert" id="currency" required>
                        <option value="" disabled selected hidden>Selcione um idioma</option>
                        <option value="USD">Dolar americano</option>
                        <option value="EUR">Euro</option>
                        <option value="JPY">Iene japonês</option>
                        <option value="ARS">Peso argentino</option>
                        <option value="CNY">Yuan chinês</option>
                    </select>
                </div>
                
                <button class="btn">Converter em reais</button>
            </form>                
        </div>
        
        <footer class="result" >
            <span id="currency-info">US$ 1 = R$ 5,13</span>
            <h2 id="final-value">US$ 512,62</h2>
        </footer>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
